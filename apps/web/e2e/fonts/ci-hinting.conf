<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  The text rendering CI's baselines were taken with: Ubuntu 24.04's stock
  `fontconfig-config` defaults (10-hinting-slight, 10-sub-pixel-rgb,
  10-yes-antialias, 11-lcdfilter-default), assigned here so that a host whose
  own fontconfig overrides them draws the same pixels. The Claude Code cloud
  image adds `/etc/fonts/conf.d/12-unhinted-grayscale.conf`, which assigns
  unhinted grayscale text and failed every `m42-demo-trips` screenshot locally
  (KI-2026-10-24-b). On CI these assignments restate what is already set.
  Read only by `m42-demo-trips.spec.ts`, the one spec that compares pixels.
-->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <match target="pattern">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
  </match>
</fontconfig>
