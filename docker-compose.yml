services:
  postgres:
    # pgvector: migration 0054 creates the extension; CI runs the same image.
    image: pgvector/pgvector:pg17
    # Default must match apps/web/.env.example's DATABASE_URL port.
    ports: ["${POSTGRES_PORT:-5433}:5432"]
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: travel
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 15
volumes:
  pgdata:
