services:
  postgres:
    image: postgres:17
    ports: ["5433:5432"]
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: travel
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 15
volumes:
  pgdata:
