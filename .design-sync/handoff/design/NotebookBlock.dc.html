<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/travel-collab-ui-baseline-c5b66415-77a7-4370-aec7-2bcbd6dd88ec/fonts/fonts.css">
  <link rel="stylesheet" href="_ds/travel-collab-ui-baseline-c5b66415-77a7-4370-aec7-2bcbd6dd88ec/_ds_bundle.css">
  <link rel="stylesheet" href="_ds/travel-collab-ui-baseline-c5b66415-77a7-4370-aec7-2bcbd6dd88ec/styles.css">
  <script src="_ds/travel-collab-ui-baseline-c5b66415-77a7-4370-aec7-2bcbd6dd88ec/_ds_bundle.js"></script>
</helmet>

<div style="border: 1px {{ edgeStyle }} {{ edgeColor }}; border-radius: 10px; overflow: hidden; background: var(--color-surface);">
  <sc-if value="{{ hasCaption }}" hint-placeholder-val="{{ false }}">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 13px; background: var(--color-paper); border-bottom: 1px solid var(--color-hairline);">
      <span style="font-family: var(--font-next-mono); font-size: 10px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--color-slate);">{{ caption }}</span>
      <span style="font-family: var(--font-next-mono); font-size: 10px; color: var(--color-slate);">{{ countLabel }}</span>
    </div>
  </sc-if>

  <sc-for list="{{ rows }}" as="r" hint-placeholder-count="3">
    <div style="display: grid; grid-template-columns: {{ cols }}; gap: 14px; align-items: baseline; padding: 10px 13px; border-bottom: 1px solid var(--color-hairline); background: {{ r.bg }};">
      <sc-for list="{{ r.cells }}" as="c" hint-placeholder-count="2">
        <span style="min-width: 0; font-family: {{ c.font }}; font-size: 13.5px; line-height: 1.5; font-weight: {{ c.weight }}; color: {{ c.ink }}; text-align: {{ c.align }}; text-wrap: pretty;">{{ c.text }}</span>
      </sc-for>
    </div>
  </sc-for>

  <sc-if value="{{ hasTotal }}" hint-placeholder-val="{{ false }}">
    <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 10px 13px; background: var(--color-moss);">
      <span style="font-size: 13.5px; font-weight: 600; color: var(--color-ink);">{{ totalLabel }}</span>
      <span style="font-family: var(--font-next-mono); font-size: 13px; font-weight: 600; color: {{ totalInk }};">{{ totalValue }}</span>
    </div>
  </sc-if>

  <sc-if value="{{ hasNote }}" hint-placeholder-val="{{ false }}">
    <div style="display: flex; align-items: flex-start; gap: 9px; padding: 11px 13px; background: {{ noteBg }};">
      <span style="font-size: 12px; line-height: 1.3; color: {{ noteInk }};">{{ noteMark }}</span>
      <span style="flex: 1; min-width: 0; font-size: 12.5px; line-height: 1.5; color: {{ noteInk }}; text-wrap: pretty;">{{ note }}</span>
    </div>
  </sc-if>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:620,&quot;height&quot;:300},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;ok&quot;,&quot;ghost&quot;,&quot;empty&quot;,&quot;stale&quot;],&quot;default&quot;:&quot;ghost&quot;,&quot;tsType&quot;:&quot;BlockState&quot;},&quot;caption&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;A day's stops&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;columns&quot;:{&quot;editor&quot;:null,&quot;default&quot;:[{&quot;kind&quot;:&quot;time&quot;,&quot;width&quot;:&quot;84px&quot;},{&quot;kind&quot;:&quot;text&quot;},{&quot;kind&quot;:&quot;money&quot;,&quot;width&quot;:&quot;90px&quot;}],&quot;tsType&quot;:&quot;Column[]&quot;},&quot;rows&quot;:{&quot;editor&quot;:null,&quot;default&quot;:[],&quot;tsType&quot;:&quot;Row[]&quot;},&quot;needsLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;a day&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;emptyText&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;No stops on this day yet.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;totalLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
// Every block widget is the same object: an optional caption strip, a fixed set of
// columns, N rows, an optional total, and one note line that carries whichever of
// the four states it is in. A day's stops, a cost table and days-at-a-glance
// differ only in their columns and rows — so they cannot drift apart in spacing,
// borders, or what an empty one says.
//
// FOUR STATES, and they are not interchangeable:
//   ok      bound, has rows                    solid edge, rows
//   ghost   an input is unbound                dashed edge, ghost rows, says what it needs
//   empty   bound, nothing matches             solid edge, no rows, says WHY it is empty
//   stale   bound to something deleted         dashed edge, names what it lost
class Component extends DCLogic {
  GHOST_CELL = { money: '$XXX', count: 'NN', date: 'Ddd Mmm N', time: '--:-- am', text: '\u2014\u2014\u2014\u2014\u2014\u2014' };
  renderVals() {
    const p = this.props;
    const state = p.state || 'ok';
    const cols = p.columns || [{ kind: 'text' }, { kind: 'text' }];
    const ghost = state === 'ghost';
    const rows = ghost
      // A ghost block shows the shape it will have: the real column set, and
      // three rows, because "how many" is exactly what is not known yet.
      ? [0, 1, 2].map(() => ({ bg: 'transparent', cells: cols.map(c => this.cell(c, this.GHOST_CELL[c.kind] || this.GHOST_CELL.text, true)) }))
      : (p.rows || []).map(r => ({ bg: r.bg || 'transparent', cells: cols.map((c, i) => this.cell(c, (r.cells || [])[i], false)) }));
    const notes = {
      ghost: p.needsLabel ? 'Not set up \u2014 point it at ' + p.needsLabel + ' and these rows become the real ones.' : 'Not set up yet.',
      empty: p.emptyText || 'Nothing here yet, so this prints nothing.',
      stale: (p.lostLabel ? p.lostLabel + ' no longer exists' : 'What this pointed at no longer exists') + ' \u2014 point it somewhere and it fills in again.',
      ok: ''
    };
    return {
      edgeStyle: ghost || state === 'stale' ? 'dashed' : 'solid',
      edgeColor: ghost || state === 'stale' ? 'var(--color-border-strong)' : 'var(--color-hairline)',
      cols: cols.map(c => c.width || 'minmax(0, 1fr)').join(' '),
      hasCaption: !!p.caption, caption: p.caption,
      countLabel: ghost ? 'NN rows' : ((p.rows || []).length + ' rows'),
      rows: rows,
      hasTotal: !!p.totalLabel, totalLabel: p.totalLabel,
      totalValue: ghost ? this.GHOST_CELL.money : p.totalValue,
      totalInk: ghost ? 'var(--color-slate)' : 'var(--color-ink)',
      hasNote: !!notes[state], note: notes[state],
      noteMark: state === 'ghost' ? '\u25c7' : state === 'stale' ? '\u26a0' : '\u00b7',
      noteBg: state === 'ok' ? 'var(--color-paper)' : 'var(--color-warning-tint)',
      noteInk: state === 'ok' ? 'var(--color-slate)' : 'var(--color-warning-ink)'
    };
  }
  cell(col, text, isGhost) {
    const mono = col.kind === 'money' || col.kind === 'date' || col.kind === 'time' || col.kind === 'count';
    return {
      text: text === undefined || text === null || text === '' ? (this.GHOST_CELL[col.kind] || this.GHOST_CELL.text) : String(text),
      font: mono ? 'var(--font-next-mono)' : 'inherit',
      weight: col.strong ? '600' : '400',
      align: col.align || (mono ? 'right' : 'left'),
      ink: isGhost || text === undefined || text === '' ? 'var(--color-slate)' : 'var(--color-ink)'
    };
  }
}

</script>
</body>
</html>
