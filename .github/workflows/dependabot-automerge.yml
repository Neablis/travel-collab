name: dependabot-automerge

# Merges a Dependabot PR once `ci` has passed on its current head. Majors are
# left for a person.
#
# Why this runs on `workflow_run` and not `gh pr merge --auto`:
# GitHub's native auto-merge waits on *required* status checks, and `main` has
# none (`docs/guidelines/ci-cost-and-capacity.md`). With no required checks,
# `--auto` on a clean PR merges straight away, before CI has finished. Turning
# on required checks is not the fix either: `ci.yml`'s `paths-ignore` would then
# block every docs-only PR forever (the trap that guideline describes). So this
# job waits for `ci` to finish and then checks what it needs to itself.
#
# `workflow_run` runs with a write token in the context of `main`. That is safe
# here only because nothing below checks out or runs code from the PR. It reads
# metadata through the API and nothing else. Keep it that way.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Merge if safe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GH_REPO_OWNER: ${{ github.repository_owner }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail

          pr=$(gh api "repos/$GH_REPO/pulls?state=open&head=$GH_REPO_OWNER:$HEAD_BRANCH" \
            --jq ".[] | select(.user.login == \"dependabot[bot]\" and .head.sha == \"$HEAD_SHA\") | .number")
          if [ -z "$pr" ]; then
            echo "No open Dependabot PR has $HEAD_SHA as its head (a newer push or already closed). Nothing to do."
            exit 0
          fi

          # Every commit must be Dependabot's. A person who pushed a fix onto the
          # branch should get a review, not a silent merge.
          others=$(gh api "repos/$GH_REPO/pulls/$pr/commits" \
            --jq '[.[] | (.author.login // "unknown") | select(. != "dependabot[bot]")] | length')
          if [ "$others" != "0" ]; then
            echo "PR #$pr has commits from someone other than Dependabot; leaving it for review."
            exit 0
          fi

          # A skipped job still leaves the run green (draft PRs skip both), so
          # check that the jobs themselves passed on this exact head.
          for check in static-and-unit integration-e2e; do
            conclusion=$(gh api "repos/$GH_REPO/commits/$HEAD_SHA/check-runs?check_name=$check" \
              --jq '.check_runs[0].conclusion // "missing"')
            if [ "$conclusion" != "success" ]; then
              echo "$check is '$conclusion' on $HEAD_SHA; not merging PR #$pr."
              exit 0
            fi
          done

          # dependabot.yml ignores majors for version updates, but security
          # updates ignore that file and can be majors. Read every "from A to B"
          # in the title and body (single and grouped PRs both word it that way)
          # and stop on a major, or on a minor below 1.0.0. If none can be read,
          # don't guess.
          text=$(gh pr view "$pr" --json title,body --jq '.title + "\n" + .body')
          pairs=$(printf '%s\n' "$text" \
            | grep -oE 'from `?v?[0-9]+(\.[0-9]+)*[^ `]*`? to `?v?[0-9]+(\.[0-9]+)*[^ `]*`?' \
            | sed -E 's/`//g; s/(from|to) v/\1 /g; s/^from ([^ ]+) to ([^ ]+)$/\1 \2/; s/\.$//' \
            | sort -u || true)
          if [ -z "$pairs" ]; then
            echo "Could not read any versions from PR #$pr; leaving it for review."
            exit 0
          fi
          while read -r old new; do
            old_major=${old%%.*}; new_major=${new%%.*}
            old_minor=$(echo "$old" | cut -d. -f2); new_minor=$(echo "$new" | cut -d. -f2)
            if [ "$old_major" != "$new_major" ] || { [ "$old_major" = "0" ] && [ "$old_minor" != "$new_minor" ]; }; then
              echo "PR #$pr includes a breaking bump ($old -> $new); leaving it for review."
              exit 0
            fi
          done <<< "$pairs"

          echo "Merging PR #$pr at $HEAD_SHA:"
          echo "$pairs"
          gh pr merge "$pr" --merge --match-head-commit "$HEAD_SHA"
