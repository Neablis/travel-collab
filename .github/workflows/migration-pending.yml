name: migration-pending

# A READ-ONLY QUESTION, asked by hand: "is production at this tree?" It applies
# nothing. One SELECT against `drizzle.__drizzle_migrations`
# (`apps/web/scripts/check-migration-state.mjs`); red only when production
# really is behind.
#
# It used to run on every push to `main` touching `apps/web/drizzle/**`, as the
# detector for a migration nobody had dispatched (KI-2026-09-05-k). Since
# ADR-091 (2026-11-15) `deploy-production.yml` applies migrations on every push
# and then runs this same check itself, before it deploys, so a push trigger
# here would only race it: reading production while deploy-production is still
# migrating, and going red on a state that a minute later is green. The push
# trigger is gone; the dispatch stays, because "were 0012-0015 ever applied?"
# is still worth answering without applying anything.
on:
  workflow_dispatch:

permissions:
  contents: read

# Read-only, so it stays out of the `production` group that deploy-production
# and migrate-production share: a newer dispatch may supersede this one.
concurrency:
  group: migration-pending
  cancel-in-progress: true

jobs:
  pending:
    runs-on: ubuntu-latest
    # Runaway cap only: checkout + install + one SELECT.
    timeout-minutes: 10
    steps:
      # `persist-credentials: false`: checkout otherwise leaves the job's token
      # in `.git/config`, where `pnpm install` and everything after it can read
      # it (zizmor `artipacked`, CodeRabbit on PR #155). Nothing here needs git
      # AUTH — the journal check runs `--ref HEAD`, a local ref — so the token
      # buys nothing and costs a credential sitting in the workspace.
      #
      # NOT copied to `ci.yml`: that job runs `git fetch origin main` for the
      # migration wall's baseline, which is a real authenticated git operation.
      # Turning credentials off there would break the very check this PR added.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Shape first, and without a database. If the journal itself is wrong —
      # two entries sharing an idx, a .sql nothing will ever apply — then what
      # production is missing is the second question, not the first. `--ref
      # HEAD` because on `main` the baseline IS this commit, so the comparison
      # is vacuous and only the shape rules run.
      - name: Journal shape
        run: node scripts/check-migration-journal.mjs --ref HEAD

      # Production's Postgres listens on the box's loopback only (ADR-093): the
      # tunnel makes it 127.0.0.1:15432 here, where PRODUCTION_DATABASE_URL points.
      - uses: ./.github/actions/db-tunnel
        with:
          ssh-key: ${{ secrets.BOX_SSH_KEY }}
          known-hosts: ${{ secrets.BOX_SSH_KNOWN_HOSTS }}
          host: ${{ secrets.BOX_SSH_HOST }}

      - name: Is production behind this tree?
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: pnpm --filter web db:state
