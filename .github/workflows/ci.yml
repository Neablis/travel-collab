name: ci
on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/travel
  AUTH_SECRET: ci-secret
  AUTH_DEV_LOGIN: "true"
  # Auth.js v5 rejects requests from untrusted hosts under `next start`
  # (production mode) unless the platform sets this itself (Vercel does).
  # CI runs `next start` for e2e, so it must opt in explicitly.
  AUTH_TRUST_HOST: "true"
  # Belt-and-suspenders for the environments guideline's claim that AI_LIVE
  # lives in ".env.local / the CI env": route.int.test.ts's one
  # no-model-injected test already pins AI_LIVE itself per-test, and
  # playwright.config.ts's webServer.env sets it for e2e, but setting it here
  # too means a workflow-level env var backs that claim rather than only
  # test-level plumbing.
  AI_LIVE: "false"

jobs:
  # No Postgres, no build — pure static analysis, so it's the fastest lane
  # and runs in parallel with the other two instead of gating them.
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint

  # Unit tests (vitest.unit.config.ts) don't touch Postgres either, so they
  # run in their own parallel lane rather than serialized after static-checks.
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # Everything that needs Postgres, a real build, and a browser: migrations,
  # integration tests, and e2e. This is the long pole, so it also runs in
  # parallel with the two lanes above rather than after them.
  integration-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: travel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 2s --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web db:migrate
      - run: pnpm --filter web test:int
      # Playwright's OS-level deps (apt packages) aren't cacheable and must
      # install fresh on every runner; the browser binary download is the
      # slow part and is what the cache step below skips on a hit.
      - run: pnpm --filter web exec playwright install-deps chromium
      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter web exec playwright install chromium
      - uses: actions/cache@v6
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/**/*.[jt]s', 'apps/web/**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm --filter web build
      - run: pnpm --filter web test:e2e

  migrate-production:
    needs: [static-checks, unit-tests, integration-e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web db:migrate
        env:
          # Overrides the workflow-level localhost value with the real target.
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
