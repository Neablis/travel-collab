name: ci
on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/travel
  AUTH_SECRET: ci-secret
  AUTH_DEV_LOGIN: "true"
  # Auth.js v5 rejects requests from untrusted hosts under `next start`
  # (production mode) unless the platform sets this itself (Vercel does).
  # CI runs `next start` for e2e, so it must opt in explicitly.
  AUTH_TRUST_HOST: "true"

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: travel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 2s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm --filter web db:migrate
      - run: pnpm --filter web test:int
      - run: pnpm --filter web exec playwright install chromium --with-deps
      - run: pnpm --filter web build
      - run: pnpm --filter web test:e2e

  migrate-production:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web db:migrate
        env:
          # Overrides the workflow-level localhost value with the real target.
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
