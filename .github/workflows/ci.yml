name: ci

# Path filters, draft gating and the concurrency block below exist because CI
# minutes are a real budget, not a free resource: this repo is private on a
# GitHub Free plan, so it gets 2,000 Linux minutes/month and nothing more. A
# measured 30-day sample (2026-07-28 → 2026-08-27) burned 1,956 of them, and
# the last six days of that window ran at ~281 min/day — a ~8,400 min/month
# pace. `docs/guidelines/ci-cost-and-capacity.md` has the full accounting and
# the reasoning behind each lever here; change these blocks against that
# document rather than against intuition about what "looks wasteful".
on:
  # Pull requests only. A push to `main` used to re-run all of this to gate an
  # automatic production migration; that migration is now dispatched
  # explicitly (`.github/workflows/migrate-production.yml`), so re-testing the
  # merge result bought nothing the pull-request run — which runs against
  # `refs/pull/N/merge`, i.e. the same tree that lands — had not already
  # proven. It cost ~456 billed minutes a month, 23% of the total.
  #
  # What this gives up: a test failure introduced by merging a stale branch is
  # not caught until the next pull request. Vercel still builds `main` on every
  # push, so a broken *build* surfaces immediately; a broken *test* does not.
  pull_request:
    # `ready_for_review` is added to the default set so a draft PR gets its
    # first full run at the moment it stops being a draft. The `if:` guard on
    # each job below is the other half: together they mean an agent branch
    # pays for CI once when it's ready, not once per intermediate commit.
    # Measured: PR #55 spent 31 runs / 315 minutes across 37 commits.
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - 'docs/**'
      - '.agents/**'
      - '.claude/**'
      # Root-level prose only (README, AGENTS, CLAUDE, TODO). Deliberately NOT
      # `**/*.md`: that would also match `.design-sync/**`, which is a real
      # build input — `api/dev/reset-demo-data/route.ts` imports
      # `.design-sync/handoff/data/japan-trip-seed.json` and
      # `japanTripImporter.test.ts` reads it — so that tree must keep
      # triggering CI even when only its prose moves.
      - '*.md'

# Supersede an in-flight run when a newer commit lands on the same PR. Safe to
# make unconditional now that this workflow only ever runs on pull requests —
# nothing here touches production. The one job that does
# (`migrate-production.yml`) sets `cancel-in-progress: false` for exactly the
# reason this sets it true: cancelling a migration mid-apply is unrecoverable.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for every job. Each one only checks out the repo and runs
# checks against it; none writes back to the repository, opens issues, or
# publishes anything. Without this block all jobs inherit the repository
# default, which is wider than either of them needs.
permissions:
  contents: read

env:
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/travel
  AUTH_SECRET: ci-secret
  AUTH_DEV_LOGIN: "true"
  # Auth.js v5 rejects requests from untrusted hosts under `next start`
  # (production mode) unless the platform sets this itself (Vercel does).
  # CI runs `next start` for e2e, so it must opt in explicitly.
  AUTH_TRUST_HOST: "true"
  # Belt-and-suspenders for the environments guideline's claim that AI_LIVE
  # lives in ".env.local / the CI env": route.int.test.ts's one
  # no-model-injected test already pins AI_LIVE itself per-test, and
  # playwright.config.ts's webServer.env sets it for e2e, but setting it here
  # too means a workflow-level env var backs that claim rather than only
  # test-level plumbing.
  AI_LIVE: "false"

jobs:
  # Static analysis and unit tests share a job because neither needs Postgres,
  # a build, or a browser, and both were paying ~20s of checkout/pnpm/node
  # setup plus a whole rounded-up billed minute to run apart. Merged, they cost
  # one setup and one rounding instead of two: ~186 min/month at the sampled
  # volume, for ~43s of extra wall clock.
  #
  # The `!cancelled()` guards keep what the split used to buy. Running these
  # serially would otherwise mean a `tsc` failure masks lint and test results
  # until the next push; with the guards every step still runs and still fails
  # the job, so one run reports every failure — same signal, one job.
  static-and-unit:
    # A draft PR is an agent mid-flight. Skip it here rather than at the `on:`
    # level so the check still appears (skipped, not missing) on the PR.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # Runaway cap, not a performance budget. The default is 360 minutes: one
    # wedged run would bill 18% of the 2,000-minute monthly cap on its own.
    # This job averages 4.6 min of measured job time (see
    # docs/guidelines/ci-cost-and-capacity.md) and its slowest step is
    # `pnpm test` at ~160s, so 15 leaves >3x headroom for a slow runner or a
    # cold pnpm store. Raise it if a real run ever gets killed; do not tune it
    # downward toward the average — a false kill costs a whole re-run.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - if: '!cancelled()'
        run: pnpm lint
      - if: '!cancelled()'
        run: pnpm test

  # Everything that needs Postgres, a real build, and a browser: migrations,
  # integration tests, and e2e. This is the long pole, so it runs in parallel
  # with the lane above rather than after it.
  integration-e2e:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # Same runaway cap, sized for the long pole. 4.1 min average, but the
    # worst legitimate case is a cold run that misses both caches: pnpm
    # install, Playwright's chromium download, and a `next build` with no
    # `.next/cache` stack up to roughly 6 minutes. 20 keeps >3x on that.
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: travel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 2s --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web db:migrate
      - run: pnpm --filter web test:int
      # Playwright's OS-level deps (apt packages) aren't cacheable and must
      # install fresh on every runner; the browser binary download is the
      # slow part and is what the cache step below skips on a hit.
      - run: pnpm --filter web exec playwright install-deps chromium
      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter web exec playwright install chromium
      - uses: actions/cache@v6
        with:
          path: apps/web/.next/cache
          # Source trees only. This step runs after `pnpm install`, and
          # `apps/web/**` matches `apps/web/node_modules/**` — whose pnpm
          # symlinks `hashFiles` follows — so the old pattern walked the whole
          # dependency graph on every run of the long-pole job to compute a
          # key. `src` trees are the actual build inputs; `next.config.ts` is
          # the one build input outside them worth invalidating on.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**', 'packages/*/src/**', 'apps/web/next.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm --filter web build
      - run: pnpm --filter web test:e2e
      # playwright.config.ts sets `trace: "on-first-retry"`, so a CI failure
      # already produces a trace — without this step it was written to the
      # runner's disk and thrown away, leaving log-reading as the only way to
      # diagnose a remote failure. `if: failure()` keeps green runs from
      # uploading an empty artifact.
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore

