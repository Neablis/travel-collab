name: ci

# The path filter, draft gating and the concurrency block below were introduced
# when CI minutes were a hard budget (private repo, GitHub Free, 2,000
# min/month; a 30-day sample to 2026-08-27 burned 1,956). The repo went public
# on 2026-08-31, so hosted-runner minutes are now unlimited and the minute
# figures in the comments below are history, not a cap. The levers stay for
# wall clock and signal: every run an agent or reviewer waits on costs session
# time and Claude tokens. `docs/guidelines/ci-cost-and-capacity.md` has the
# full accounting and the current reasoning behind each lever; change these
# blocks against that document rather than against intuition about what
# "looks wasteful".
on:
  # Pull requests only. A push to `main` used to re-run all of this to gate an
  # automatic production migration; that migration is now dispatched
  # explicitly (`.github/workflows/migrate-production.yml`), so re-testing the
  # merge result bought nothing the pull-request run — which runs against
  # `refs/pull/N/merge`, i.e. the same tree that lands — had not already
  # proven. It cost ~456 billed minutes a month, 23% of the total.
  #
  # What this gives up: a test failure introduced by merging a stale branch is
  # not caught until the next pull request. Vercel still builds `main` on every
  # push, so a broken *build* surfaces immediately; a broken *test* does not.
  pull_request:
    # `ready_for_review` is added to the default set so a draft PR gets its
    # first full run at the moment it stops being a draft. The `if:` guard on
    # each job below is the other half: together they mean an agent branch
    # pays for CI once when it's ready, not once per intermediate commit.
    # Measured: PR #55 spent 31 runs / 315 minutes across 37 commits.
    types: [opened, synchronize, reopened, ready_for_review]
    # No `paths-ignore`, and that is deliberate. `ci-ok` below is a required
    # check on `main`, and a workflow filtered out by path never starts, so
    # its required check never reports and the PR can never merge. The prose
    # filter that used to live here is the `changes` job: the workflow always
    # starts, and on a prose-only PR the real jobs skip and `ci-ok` passes in
    # seconds. `docs/guidelines/ci-cost-and-capacity.md` has the history.

# Supersede an in-flight run when a newer commit lands on the same PR. Safe to
# make unconditional now that this workflow only ever runs on pull requests —
# nothing here touches production. The one job that does
# (`migrate-production.yml`) sets `cancel-in-progress: false` for exactly the
# reason this sets it true: cancelling a migration mid-apply is unrecoverable.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for every job. Each one only checks out the repo and runs
# checks against it; none writes back to the repository, opens issues, or
# publishes anything. Without this block all jobs inherit the repository
# default, which is wider than either of them needs.
permissions:
  contents: read

env:
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/travel
  AUTH_SECRET: ci-secret
  # API tokens are stored as HMAC-SHA256(API_TOKEN_PEPPER, secret), and both
  # minting and verifying throw without it rather than falling back — an empty
  # pepper still produces a stable digest, so a fallback would leave tokens
  # working while the property the key exists for silently did not hold. CI does
  # not need a real one; it needs a present one.
  API_TOKEN_PEPPER: ci-pepper
  AUTH_DEV_LOGIN: "true"
  # Auth.js v5 rejects requests from untrusted hosts under `next start`
  # (production mode) unless the platform sets this itself (Vercel does).
  # CI runs `next start` for e2e, so it must opt in explicitly.
  AUTH_TRUST_HOST: "true"
  # Belt-and-suspenders for the environments guideline's claim that AI_LIVE
  # lives in ".env.local / the CI env": route.int.test.ts's one
  # no-model-injected test already pins AI_LIVE itself per-test, and
  # playwright.config.ts's webServer.env sets it for e2e, but setting it here
  # too means a workflow-level env var backs that claim rather than only
  # test-level plumbing.
  AI_LIVE: "false"
  # No test sends to Sentry (Mitchell, 2026-09-24: no automated test calls a
  # real third party). `sentry.shared.ts` falls back to a hard-coded DSN when
  # this is unset, and a `NEXT_PUBLIC_` value is inlined at BUILD time, so the
  # empty string (the SDK's documented off switch) is set for the whole
  # workflow — the build the e2e job serves, and every test lane.
  NEXT_PUBLIC_SENTRY_DSN: ""

jobs:
  # SEVEN JOBS, ALL IN PARALLEL (2026-10-01): six, with e2e in two shards. Until then this was two jobs —
  # `static-and-unit` (typecheck, lint, unit, script tests in a row) and
  # `integration-e2e` (int, then build and e2e) — because each job paid its
  # setup in billed minutes on a 2,000-minute private plan. The repo has been
  # public since 2026-08-31, minutes are free, and what is left to save is wall
  # clock: measured on #281, the two jobs took ~9 minutes end to end; split, the
  # run is as long as its longest job (e2e, ~5.5 minutes).
  #
  # Every job runs the same `.github/actions/setup-workspace` (~18s on a warm
  # pnpm store), so no job sets up differently from another. GitHub-hosted
  # jobs cannot share a machine; one identical, cached setup per job is the
  # floor, and at 18s it is the cheap part.
  #
  # Splitting also replaces the `!cancelled()` guards that kept one failing
  # step from hiding the rest: each check is its own job now, so every one
  # reports independently.
  #
  # Every one of them `needs: changes` and runs only when it says code moved.
  # `changes` carries the draft gate — a draft PR is an agent mid-flight — and
  # a job whose `needs` was skipped is skipped too, so a draft runs nothing.
  # Skipped rather than filtered at the `on:` level so the checks still appear
  # (skipped, not missing) on the PR. Timeouts are runaway caps, ~3x the
  # measured job, not performance budgets: a false kill costs a whole re-run.
  #
  # The `name:` prefixes (`static /`, `test /`) are for the PR's check list,
  # which sorts by name: they keep the two kinds together. Job ids are what
  # `needs:` and the docs use, and did not change.

  # Does this PR touch anything but prose? `scripts/ci-gate.mjs` has the path
  # set and the reason this is a job and not `paths-ignore`.
  changes:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      # A `pull_request` run checks out GitHub's merge of the PR into its
      # base, so the merge commit's first parent is the base and the diff
      # between them is the whole PR — the same thing `paths-ignore` judged.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: diff
        run: |
          set -euo pipefail
          git rev-parse --verify HEAD^2 >/dev/null
          git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/paths"
          echo "$(wc -l < "$RUNNER_TEMP/paths") changed paths"
          node scripts/ci-gate.mjs changes < "$RUNNER_TEMP/paths" | tee -a "$GITHUB_OUTPUT"

  typecheck:
    name: static / typecheck
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - run: pnpm typecheck
      # `drizzle-kit check` reads the migration SNAPSHOTS and reports two things
      # nothing else here does: a malformed snapshot, and a *collision* — two
      # snapshots naming the same parent, which is what two branches generating
      # migrations in parallel leaves behind when a merge keeps both. It reads
      # `_journal.json` not at all (measured 2026-09-07: a journal with two
      # `idx: 18` entries printed "Everything's fine"), which is why `pnpm lint`
      # separately runs `scripts/check-migration-journal.mjs`. The two overlap
      # nowhere. ~2s, no database, no build. KI-2026-09-05-k.
      - if: '!cancelled()'
        run: pnpm --filter web db:check

  lint:
    name: static / lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # `pnpm lint` runs `scripts/check-migration-journal.mjs`, whose HEADLINE
      # rule — a new migration's `when` must exceed `main`'s newest — needs
      # `main`'s journal, i.e. a git ref. `actions/checkout` fetches only the
      # ref under test, so without this the wall finds no `origin/main`,
      # degrades to shape-only and exits 0. It said so in its own banner and
      # nobody read it: measured on a CI-like shallow clone 2026-09-07,
      # "19 entries, shape only — baseline NOT compared". A wall that can only
      # run on the contributor's laptop is advice, not a gate, and the case it
      # exists for (a branch cut before main's newest migration) is exactly the
      # one that reaches CI without ever touching that laptop again.
      # One commit, ~1s. Found by Copilot's review of PR #155.
      #
      # It ASSERTS the ref rather than tolerating a miss. The first draft wrote
      # `|| echo "…degrades to shape-only"`, which reproduces the exact defect
      # being fixed one level up: the step would report success while the wall
      # went back to comparing nothing, and the only witness would again be a
      # line buried in a log nobody reads. `origin` is the BASE repository even
      # for a fork PR, so `main` is always fetchable here; if this ever fails it
      # is a real infrastructure fault and a red step is the correct outcome.
      - name: Fetch main, so the migration journal wall has a baseline
        run: |
          git fetch --depth=1 origin main:refs/remotes/origin/main
          git rev-parse --verify refs/remotes/origin/main >/dev/null
          echo "baseline ref present: $(git rev-parse --short refs/remotes/origin/main)"
      - uses: ./.github/actions/setup-workspace
      - run: pnpm lint

  # Every workspace package's vitest suite (`pnpm -r test`): ~2 minutes.
  unit:
    name: test / unit
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - run: pnpm test:unit

  # `scripts/**/__tests__` under node:test: ~90s, most of it
  # check-lint-wall.test.mjs running eslint against sabotaged configs.
  script-tests:
    name: test / scripts
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - run: pnpm test:scripts

  # Postgres-backed integration tests: ~2.5 minutes.
  integration:
    name: test / integration
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # Docker's official image from Amazon ECR Public, not Docker Hub:
        # anonymous pulls from shared GitHub runners hit Docker Hub's rate
        # limit (`toomanyrequests`) and fail the job before any test runs
        # (#378, 2026-10-09). ECR Public holds a durable copy (`docker/library`);
        # mirror.gcr.io is only a cache, with no fallback when it misses.
        image: public.ecr.aws/docker/library/postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: travel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 2s --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      # No `db:migrate` step: since KI-2026-08-30-e both lanes below provision
      # their own database per run (apps/web/scripts/with-test-db.mjs), applying
      # the migrations themselves into a template. Migrating the service
      # container's `travel` database would migrate a database nothing opens.
      - run: pnpm --filter web test:int

  # A production build and Playwright against it, in two shards. Unsplit this
  # was the long pole: 5m24s of a 5m30s run, 4m10s of it Playwright. Each shard
  # repeats setup, Postgres and `next build` (~15s on a warm `.next/cache`) to
  # run half the specs; Playwright splits by file (24 and 22 of 45 files, plus
  # `auth.setup.ts`, the `setup` project every spec depends on, in each).
  # Needs its own Postgres for the same reason as `integration`: both lanes
  # provision their databases per run (apps/web/scripts/with-test-db.mjs).
  #
  # Free on a public repo; the one limit is the Free plan's 20 concurrent
  # jobs, which a push (7 ci jobs + 3 CodeQL + 2 others) stays well inside.
  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: test / e2e (${{ matrix.shard }}/2)
    strategy:
      # Both shards report even when one fails, so a red run lists every
      # failing spec, not half of them.
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-latest
    # The worst legitimate case is a cold run that misses both caches:
    # Playwright's chromium download and a `next build` with no `.next/cache`.
    timeout-minutes: 20
    services:
      postgres:
        # Docker's official image from Amazon ECR Public, not Docker Hub:
        # anonymous pulls from shared GitHub runners hit Docker Hub's rate
        # limit (`toomanyrequests`) and fail the job before any test runs
        # (#378, 2026-10-09). ECR Public holds a durable copy (`docker/library`);
        # mirror.gcr.io is only a cache, with no fallback when it misses.
        image: public.ecr.aws/docker/library/postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: travel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 2s --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      # Playwright's OS-level deps (apt packages) aren't cacheable and must
      # install fresh on every runner; the browser binary download is the
      # slow part and is what the cache step below skips on a hit.
      - run: pnpm --filter web exec playwright install-deps chromium
      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter web exec playwright install chromium
      - uses: actions/cache@v6
        with:
          path: apps/web/.next/cache
          # Source trees only. This step runs after `pnpm install`, and
          # `apps/web/**` matches `apps/web/node_modules/**` — whose pnpm
          # symlinks `hashFiles` follows — so the old pattern walked the whole
          # dependency graph on every run of the long-pole job to compute a
          # key. `src` trees are the actual build inputs; `next.config.ts` is
          # the one build input outside them worth invalidating on.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**', 'packages/*/src/**', 'apps/web/next.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-
      # Sentry off in the build e2e serves. `NEXT_PUBLIC_*` is inlined at BUILD
      # time, so `playwright.config.ts`'s webServer env cannot reach the browser
      # bundle under `next start` — this step is where it has to be set. The
      # empty string is the SDK's documented no-op; unset would fall back to
      # the real DSN (`sentry.shared.ts`). No automated test talks to a real
      # third party (Mitchell, 2026-09-24).
      - run: pnpm --filter web build
        env:
          NEXT_PUBLIC_SENTRY_DSN: ""
      # The regression check for the step above: fails if any built chunk still
      # carries the DSN literal from `sentry.shared.ts`, i.e. if the line above
      # was dropped or the build stopped seeing it. `test:e2e:ci-like` runs the
      # same script after its own build.
      - run: pnpm --filter web check:build-sentry
      - run: pnpm --filter web test:e2e --shard=${{ matrix.shard }}/2
      # playwright.config.ts sets `trace: "on-first-retry"`, so a CI failure
      # already produces a trace — without this step it was written to the
      # runner's disk and thrown away, leaving log-reading as the only way to
      # diagnose a remote failure. `if: failure()` keeps green runs from
      # uploading an empty artifact.
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # THE ONE REQUIRED CHECK on `main` (ruleset "Required checks for main").
  # One name, so adding, splitting or renaming a job above never needs a
  # ruleset edit — add the job to `needs` here and it is required.
  #
  # `always()` and not `!cancelled()`: a skipped job satisfies a required
  # check, so if cancelling the run could skip this one, cancelling would be
  # a way to merge. A draft cannot merge, so skipping there is safe.
  ci-ok:
    if: always() && github.event.pull_request.draft == false
    needs: [changes, typecheck, lint, unit, script-tests, integration, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/ci-gate.mjs
          sparse-checkout-cone-mode: false
      - run: node scripts/ci-gate.mjs verdict
        env:
          NEEDS: ${{ toJSON(needs) }}
