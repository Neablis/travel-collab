name: migrate-production

# BREAK-GLASS. Production migrations are applied by `deploy-production.yml` on
# every push to `main`, before it deploys (ADR-091, 2026-11-15). This manual
# dispatch stays for the cases that one does not cover: re-applying after a
# failed `deploy-production` run was fixed outside the repo, or migrating
# without deploying. It runs the same `db:migrate` against the same secret.
#
# History, because the reasoning is still sound where it applies: from
# 2026-08-27 this dispatch was the ONLY way production migrated (ADR-004's
# "explicit CI/deploy step", with a human as the trigger), to stop a full CI
# re-run of `main` gating it (~456 billed min/month; see
# `docs/guidelines/ci-cost-and-capacity.md`). Its cost was that a merged
# migration sat pending until someone remembered, and PR 752's 0078 sat for
# ~20 hours while OAuth Allow answered 500 (KI-2026-11-15-b). ADR-091 keeps the
# execution in automation and takes the human out of the trigger.
#
# It shares the `production` concurrency group with `deploy-production`, so it
# never overlaps a migration there. GitHub keeps one PENDING run per group: a
# dispatch made while a deploy is waiting replaces that deploy. If you dispatch
# this during a burst of merges, re-run deploy-production afterwards.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "migrate" to confirm applying pending migrations to production'
        required: true
        type: string

permissions:
  contents: read

# Never let two production migrations overlap, and never cancel one mid-apply.
# The group is shared with deploy-production.yml, which also migrates.
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    # A runaway cap only. It must never fire mid-apply — that is the same
    # unrecoverable state `cancel-in-progress: false` above exists to avoid —
    # so it sits far above any plausible migration (this job is checkout +
    # install + `drizzle-kit migrate`, ~1 min in the sampled runs). Without it
    # a wedged connection to Neon would bill the 360-minute default.
    timeout-minutes: 15
    steps:
      # Two rails against the two ways a dispatch goes wrong: the wrong branch
      # picked in the "Run workflow" dropdown, and a stray click. `confirm` is
      # read through the environment rather than interpolated into the script,
      # so the input can't inject shell.
      - name: Guard the dispatch
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::Refusing to migrate production from ${{ github.ref }} — dispatch this from main."
            exit 1
          fi
          if [ "$CONFIRM" != "migrate" ]; then
            echo '::error::Type "migrate" in the confirm field to proceed.'
            exit 1
          fi

      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Context for the run log, not a dry run: drizzle-kit has no reliable
      # "what would you apply" mode, so this records what the repo carried at
      # dispatch time and drizzle-kit's own output below records what it
      # actually applied. Together they make the log answer "what changed?".
      - name: Migrations present in this tree
        run: ls -1 apps/web/drizzle/*.sql

      - run: pnpm --filter web db:migrate
        env:
          # The UNPOOLED/direct connection string — DDL should not run through
          # PgBouncer (see docs/guidelines/environments-and-deploys.md).
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
