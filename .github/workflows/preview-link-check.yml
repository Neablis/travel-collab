name: preview-link-check

# Every link the landing sea draws must open a real day on the PR's preview
# (M51, "The links stay real"). The preview build seeds `content/`
# (`apps/web/scripts/build-migrate.mjs`); this requests every
# `cells[].href` in `landingSea.generated.json` against the built preview and
# fails, naming each href, on anything but a 200.
#
# `pull_request` because Coolify builds the preview from the PR and serves it
# at `https://<pr number>.preview.caesura.today`; the job waits for the preview
# to answer its health route rather than being told when it is built. Previews
# are public and NOINDEX, so no secret is involved. Not a required check:
# `ci-ok` stays the only one.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sea-links:
    # A draft is a stack part nobody is walking yet; Coolify still builds it, but
    # the check waits for the ready PR.
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    # Room for the preview's build (up to 10 min of waiting) plus a preview that
    # answers nothing: the script's per-request timeout is sized to finish
    # inside this and still name every href.
    timeout-minutes: 25
    env:
      PREVIEW_URL: https://${{ github.event.pull_request.number }}.preview.caesura.today
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .nvmrc
            scripts/check-preview-links.mjs
            apps/web/src/lib/landingSea.generated.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Wait for the preview to answer
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null --max-time 10 "$PREVIEW_URL/api/health"; then exit 0; fi
            sleep 10
          done
          echo "::error::$PREVIEW_URL/api/health did not answer in 10 minutes"
          exit 1
      - name: Request every sea link on the preview
        run: node scripts/check-preview-links.mjs
