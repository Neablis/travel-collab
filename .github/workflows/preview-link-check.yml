name: preview-link-check

# Every link the landing sea draws must open a real day on the PR's preview
# (M51, "The links stay real"). The preview build seeds `content/`
# (`coolify-preview.yml` runs `apps/web/scripts/build-migrate.mjs`); this requests every
# `cells[].href` in `landingSea.generated.json` against the built preview and
# fails, naming each href, on anything but a 200.
#
# `pull_request` because `coolify-preview.yml` builds the PR's image and the
# one preview app serves it at `https://preview.caesura.today` (M64); the job
# waits for the preview's health route to report the PR head rather than being
# told when it is deployed. Previews
# are public and NOINDEX (`X-Robots-Tag`), so no secret is involved. Not a required check:
# `ci-ok` stays the only one.
#
# Only a PR carrying the `preview` label has a preview (`coolify-preview.yml`,
# since 2026-11-14), so only such a PR is checked: waiting 30 minutes on every
# other ready PR for a preview that will never come would only spend minutes.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  sea-links:
    # A draft is a stack part nobody is walking yet: the check waits for the
    # ready PR, even if the draft was labelled for a preview.
    # `labeled` runs only for the `preview` label itself; every other event only
    # while the PR carries it.
    if: >-
      ${{ !github.event.pull_request.draft &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          contains(github.event.pull_request.labels.*.name, 'preview') &&
          (github.event.action != 'labeled' || github.event.label.name == 'preview') }}
    runs-on: ubuntu-latest
    # Room for the preview's run (it can queue behind another PR's, then installs,
    # migrates, builds and deploys: up to 30 min of waiting) plus a preview that
    # answers nothing: the script's per-request timeout is sized to finish
    # inside this and still name every href.
    timeout-minutes: 40
    env:
      PREVIEW_URL: https://preview.caesura.today
      # `github.sha` is the merge commit on `pull_request`; the preview is built from the head.
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .nvmrc
            scripts/check-preview-links.mjs
            apps/web/src/lib/landingSea.generated.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # On `synchronize` the previous push's build keeps answering until the new
      # one swaps in, and another PR's build may be on the one app, so answering is not enough: `/api/health`'s `version` (the
      # build's commit sha) must be the head. A preview that never appears is a red
      # check, not a green one that checked nothing, unless the label has left this
      # PR (it was moved to another, which owns the app now).
      - name: Wait for the preview to be of the head
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 1 180); do
            version=$(curl -fsS --max-time 10 "$PREVIEW_URL/api/health" 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).version??"")}catch{}})') || true
            if [ "$version" = "$HEAD_SHA" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            sleep 10
          done
          msg="$PREVIEW_URL/api/health did not report version $HEAD_SHA in 30 minutes (last: ${version:-no answer}); sea links not checked"
          if gh api "repos/$REPO/pulls/$PR" --jq '.labels | map(.name) | index("preview")' | grep -qx null; then
            echo "::warning::PR $PR no longer carries the \`preview\` label, so another PR owns the preview; $msg"
            echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "::error::$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Request every sea link on the preview
        if: steps.wait.outputs.ready == 'true'
        run: node scripts/check-preview-links.mjs
