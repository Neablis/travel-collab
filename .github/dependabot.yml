# Dependency updates: weekly, batched, never a major, and kept mergeable.
#
# This file began as a throttle. `docs/guidelines/ci-cost-and-capacity.md`
# recorded "no dependabot.yml" as an intentional choice against a 2,000-minute
# Free-plan cap, then ad-hoc bumps took Vitest 2 -> 3 without the migration its
# own upgrade notes mandate, and the compromise was monthly batches with
# rebasing switched off. The repo went public on 2026-08-31, minutes stopped
# being a budget, and what was left of the throttle was its cost:
#
# - `rebase-strategy: disabled` meant the second npm PR of every cycle
#   conflicted on `pnpm-lock.yaml` the moment the first merged and then sat
#   until someone commented `@dependabot rebase`. Measured 2026-10-04: #315
#   merged itself in six minutes; #316 passed `ci`, failed to merge with
#   "Pull Request has merge conflicts", and waited two hours for that comment.
# - Monthly batches were large (#283 carried 16 updates) and one bad package
#   in a batch holds up all of it.
#
# So: weekly, and Dependabot rebases its own PRs (the default — there is no
# `rebase-strategy` line below on purpose). Each rebase is a `synchronize`
# event and another `ci` run, which is free and is what lets
# `dependabot-automerge.yml` see a green run on a mergeable head.
#
# Security updates do NOT come from this file. They fire on advisory
# publication whether it exists or not, so nothing below turns them down or
# off.
#
# Merging is automatic for patch and minor bumps once `ci` passes on the PR's
# head (`.github/workflows/dependabot-automerge.yml`), security fixes included.
# Majors and 0.x minors wait for a person, security or not, and so does any PR
# whose versions cannot be read (`scripts/dependabot-versions.mjs`).
version: 2
updates:
  - package-ecosystem: npm # covers the whole pnpm workspace from the root lockfile
    directory: "/"
    schedule:
      interval: weekly
    # Two batched PRs a week, not one per dependency. Splitting production
    # from development keeps a runtime bump reviewable (and revertable) on its
    # own instead of buried in a twenty-package diff.
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development
    open-pull-requests-limit: 2
    ignore:
      # Majors are migrations, not updates — they get planned, done on their
      # own branch, and verified. Vitest 2 -> 3 landed here as a routine bump
      # and skipped a mandated migration; nothing about a Dependabot PR makes
      # anyone read release notes, so this closes the door rather than
      # trusting review to catch it.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # auto-scroll 3.2.1 is a patch that depends on core ^4.0.0, a major, so
      # taking it installs a second drag-and-drop core beside ours and
      # check-singletons fails (PR #283). Remove this with the core 4 migration.
      - dependency-name: "@atlaskit/pragmatic-drag-and-drop-auto-scroll"
        versions: [">=3.2.1"]
    commit-message:
      prefix: chore
      include: scope

  # Workflow action pins (`actions/checkout@v7` and friends). One grouped PR a
  # week; this is supply-chain hygiene, and majors are excluded here too
  # because an action major can change a workflow's contract.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore
      include: scope
