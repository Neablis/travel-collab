# CodeRabbit configuration.
#
# Why this file exists: CodeRabbit ran unconfigured until 2026-08-24 and was
# producing 26-30 inline comments per PR (#32: 26, #27: 30 across 26 separate
# review events), most of them nitpick-tier, all of them triaged by hand. It is
# worth keeping — it caught a real fire-and-forget navigation race in M10 Wave
# 2 Phase 7 that no test covered — but it is NOT a required check (see the
# correction and decision below), and it should spend its comments on this
# repo's actual invariants rather than on prose style in `docs/`.
#
# CORRECTION 2026-09-01 (KI-2026-09-01): "required check" is not true and
# `auto_review.enabled: true` below is no longer sufficient. This repo is
# public with 0 stars, below CodeRabbit's 10-star OSS gate, so auto-review is
# OFF. It still posts a green status while skipping, and PR #105 merged-clean
# with no review, so nothing here blocks. Every setting below still applies to
# a review that is manually triggered with a `@coderabbitai review` comment;
# none of it makes one happen on its own. That comment works and takes about
# 21 minutes on this tier.
#
# DECIDED 2026-09-01: CodeRabbit is no longer an automated step. It is a human
# step before merging — see AGENTS.md, "CodeRabbit is Mitchell's step". Note
# `auto_review.enabled` below is deliberately left TRUE even though the gate
# ignores it: flipping it to false would silently suppress reviews if the plan
# is ever restored, which is a worse trap than a setting that currently no-ops.
#
# See AGENTS.md for the invariants referenced below.
language: en-US

reviews:
  # "chill" reports genuine problems and drops the stylistic nitpicking that
  # made up most of the pre-config comment volume.
  profile: chill
  # CodeRabbit is advisory, not a required check (and on this OSS repo it can
  # post green while skipping — KI-2026-09-01). It should not hold a PR in
  # CHANGES_REQUESTED — a human (or the DoD checklist) decides what blocks.
  request_changes_workflow: false
  high_level_summary: true
  # The walkthrough is useful context; collapsed, it stops dominating the PR
  # page above the actual human description.
  collapse_walkthrough: true
  # Pure noise in a repo where every PR is already narrated in its description.
  poem: false
  review_status: true

  auto_review:
    enabled: true
    # A draft PR is work in progress; reviewing it burns a pass on code that
    # is about to change.
    drafts: false

  # THE DOCSTRING COVERAGE CHECK, now a setting this repo chose rather than a
  # default it inherited. It ran unconfigured until 2026-09-23 and reported
  # 66.67% (#198), 51.39% (#199) and 41.18% (#201) against an 80% floor nobody
  # had picked — three red rows in a row that meant nothing, which is the one
  # outcome KI-2026-09-20-i called worse than either answer: "a permanently-
  # failing gate is one people learn to scroll past".
  #
  # Mitchell answered it on 2026-09-22 — yes, JSDoc is the convention and 80%
  # is a floor worth having — so the threshold is written down here at the
  # value that was agreed, and `docs/guidelines/commenting.md` is the rule it
  # scores against.
  #
  # `warning`, not `error`: the absolute enforcement lives in
  # `scripts/check-docstring-wall.mjs`, which fails `pnpm lint` on any NEW
  # undocumented export and is not fooled by a percentage that a large
  # well-documented diff can carry. This check covers the other half — the
  # gradient across a PR's changed functions — and blocking on a gradient
  # while 470 grandfathered symbols are still being worked through would stop
  # PRs for a backlog nobody is being asked to clear in one pass.
  #
  # It scores the functions a PR CHANGES, not the repository: "9 functions
  # across 7 files" on #198, "72 functions across 17 files" on #199. That is
  # what settles the question KI-2026-09-22-a left open about repo-wide versus
  # changed-file measurement — it was already the latter.
  pre_merge_checks:
    docstrings:
      mode: warning
      threshold: 80

  path_filters:
    # 94 markdown files and growing. Docs correctness here is enforced by the
    # gate/DoD process, not by a prose reviewer, and markdown review was a
    # large share of the nitpick volume.
    - "!docs/**"
    - "!**/*.md"
    # drizzle-kit generates these; reviewing generated SQL and its journal
    # produces findings nobody can act on without regenerating.
    - "!apps/web/drizzle/**"
    - "!pnpm-lock.yaml"

  path_instructions:
    - path: "packages/domain/**"
      instructions: >-
        AGENTS.md invariant #4: this package is pure — flag any I/O (database,
        network, filesystem, clock, randomness) reached directly rather than
        injected. Invariant #1: the event log is the sole source of truth;
        flag state mutated outside the reducer path. Reducers and the conflict
        engine are covered by fast-check property tests — a property that
        asserts on no generated case still reports green, so flag any new
        property test that lacks a `witness` assertion floor.

    - path: "packages/contracts/**"
      instructions: >-
        AGENTS.md invariant #5: contracts change by protocol, not by drift.
        Flag any schema change that lands without a matching
        docs/contracts/CHANGELOG.md entry, and any consumer in
        packages/domain or apps/web left un-updated in the same PR.

    - path: "apps/web/src/components/**"
      instructions: >-
        Flag UI importing from packages/domain directly, and server logic
        leaking into components — both are drift signals in
        docs/guidelines/validating-direction.md. This app has had repeated
        responsive bugs invisible above 1180px (KI-16, KI-19): flag new
        fixed/absolute overlays, scrims, and breakpoint-gated layout that the
        1280px default e2e viewport would not exercise.

    # The command-pipeline rule is SCOPED, and saying so here is the whole
    # point: invariant 1 applies it to the planning domain only, and ADR-003
    # makes Identity, Access, Community and Entitlements ordinary CRUD. Left
    # unscoped, this instruction flags every write in those modules as a
    # violation — it did exactly that four times on PR #174, against code
    # ADR-045 had already settled as deliberately not event-sourced.
    - path: "apps/web/src/server/**"
      instructions: >-
        Flag direct database writes to PLANNING state (trips, days,
        activities, costs, notebooks) that bypass the command pipeline —
        invariant 1. Do NOT flag direct writes in the CRUD modules the event
        log deliberately excludes (ADR-003): Identity, Access, Community and
        Entitlements — users, invites, memberships, entitlement_grants,
        ai_usage. Also flag any hand-written type duplicating a
        packages/contracts schema. AI model output must be validated against a
        schema at its boundary (KI-9).

    # Component tests are .test.tsx and e2e specs are .spec.ts here, so a
    # single "**/*.test.ts" entry would have covered barely a third of the
    # suite and silently exempted the rest.
    - path: "**/*.{test,spec}.{ts,tsx}"
      instructions: >-
        Flag tests that assert nothing on the path they claim to cover, and
        property tests without a witness floor. A comment asserting an
        invariant with no test enforcing it is a documented recurring defect
        class here (KI-1, KI-14) — flag it.

chat:
  auto_reply: true
